<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · UFO 控制台</title><link rel="stylesheet" href="/signin.css"><script defer src="/signin.js"></script></head><body><main class="login-shell"><div class="identity"><div><strong>UFO / API</strong><small>一个控制台，管理所有连接。</small></div></div><div class="login-card"><span class="eyebrow">PRIVATE CONSOLE</span><h1>登录控制台</h1><p>输入部署时生成的控制台密码，管理账号池与代理。</p><form id="signin-form"><label for="password">控制台密码</label><div class="field"><input id="password" type="password" autocomplete="current-password" required autofocus placeholder="输入部署密码"><button type="button" id="show-password" aria-label="显示密码">显示</button></div><div class="error" id="error" role="alert" hidden></div><button class="submit" id="submit" type="submit">登录控制台 <span>→</span></button></form><div class="hint"><span>ⓘ</span><div>初始密码保存在部署数据目录的 <code>admin-password</code> 文件中。<br>API 调用使用独立的 API Key。</div></div></div><footer>UFO API CONTROL <span>PRIVATE · LOCAL</span></footer></main></body></html>
